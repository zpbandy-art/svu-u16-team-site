<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVU Fixtures</title>
<meta name="description" content="Full season schedule, results, and match highlights for Shenandoah Valley United U16 Boys.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Shenandoah Valley United">
<meta property="og:title" content="SVU U16 · Fixtures">
<meta property="og:description" content="Full season schedule, results, and match highlights for Shenandoah Valley United U16 Boys.">
<meta property="og:url" content="https://zpbandy-art.github.io/svu-u16-team-site/schedule.html">
<meta property="og:image" content="https://zpbandy-art.github.io/svu-u16-team-site/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Shenandoah Valley United badge">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#122548">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="SVU U16">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --navy:#122548;
    --navy-2:#1b3564;
    --blue:#3a67b0;
    --green:#0a8a51;
    --green-dark:#03532f;
    --red:#b3402f;
    --paper:#f5f7f9;
    --card:#ffffff;
    --ink:#13181f;
    --ink-soft:#5b6472;
    --line:#e3e7ec;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#0c1930;
      --navy-2:#132648;
      --blue:#5a86d6;
      --green:#17a468;
      --green-dark:#0a6b41;
      --red:#d9695a;
      --paper:#0b0f16;
      --card:#131a24;
      --ink:#eef1f5;
      --ink-soft:#9aa5b3;
      --line:#232c39;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0c1930;
    --navy-2:#132648;
    --blue:#5a86d6;
    --green:#17a468;
    --green-dark:#0a6b41;
    --red:#d9695a;
    --paper:#0b0f16;
    --card:#131a24;
    --ink:#eef1f5;
    --ink-soft:#9aa5b3;
    --line:#232c39;
  }

  * { box-sizing: border-box; }

  body{
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    margin: 0;
  }

  .page{
    width: 100%;
    max-width: 480px;
    padding-inline: 16px;
    padding-block: 20px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(10,20,40,0.06), 0 10px 30px rgba(10,20,40,0.08);
  }

  .header{
    background: linear-gradient(155deg, var(--navy) 0%, var(--navy-2) 62%, var(--green-dark) 130%);
    padding: 22px 20px 20px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    position: relative;
  }
  .header-main{
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .header::after{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(120px 90px at 88% -10%, rgba(255,255,255,0.10), transparent 70%);
    pointer-events:none;
  }

  .badge{
    width: 50px;
    height: 50px;
    border-radius: 13px;
    background: rgba(255,255,255,0.96);
    display:flex;
    align-items:center;
    justify-content:center;
    flex: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .badge img{ width: 40px; height: 40px; object-fit: contain; display:block; }

  .table-links{
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    position: relative;
    z-index: 1;
    padding-top: 1px;
  }
  .table-icons{
    display: grid;
    grid-template-columns: repeat(2, 24px);
    justify-content: center;
    gap: 4px;
  }
  /* When all 3 links show, push the last one (Presidents Cup, added last
     in COMP_TABLE) into the right column instead of the left, so it lines
     up under the 2nd icon above it instead of sitting under the 1st. Only
     applies when a 3rd link actually exists and isn't hidden by a tab
     filter, so a single remaining icon still sits flush in column 1. */
  .table-icons:has(.table-link:nth-child(3):not([hidden]))
    .table-link:last-child{ grid-column: 2; }
  .table-link{ display: block; }
  .table-link[hidden]{ display: none; }
  .table-link:hover img{ filter: brightness(1.08); }
  .table-link img{
    width: 24px;
    height: 24px;
    object-fit: contain;
    border-radius: 6px;
    background: rgba(255,255,255,0.96);
    padding: 3px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    display: block;
  }
  .table-label{
    color: rgba(255,255,255,0.85);
    font-family: "Barlow Condensed", "Inter", sans-serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .header-text{ min-width:0; }

  .eyebrow{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    margin: 0 0 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .club-name{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
    margin: 0 0 4px;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.78);
    text-decoration: none;
  }
  .back-link:hover{ color: #fff; }

  .tabs{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 12px 4px;
  }

  .tab{
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: "Inter", sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: color-mix(in srgb, var(--ink-soft) 10%, transparent);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 6px 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab-icon{
    width: 14px;
    height: 14px;
    object-fit: contain;
    border-radius: 3px;
    display: block;
  }
  .tab:focus-visible{
    outline: 2px solid var(--blue);
    outline-offset: 1px;
  }
  .tab.is-active{
    background: var(--navy);
    color: #ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tab.is-active{ background: var(--blue); }
  }
  :root[data-theme="dark"] .tab.is-active{ background: var(--blue); }

  .empty-state{
    display: none;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 24px 16px 20px;
  }
  .empty-state.is-visible{ display: block; }

  ul.games{
    list-style: none;
    margin: 0;
    padding: 6px 8px 10px;
  }

  .game{
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 8px;
    border-bottom: 1px solid var(--line);
  }
  .game[hidden]{ display: none; }
  .game:last-child{ border-bottom: none; }

  .date-box{
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--navy) 8%, transparent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.05;
  }
  .date-mon{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .date-day{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .game-main{ flex: 1; min-width: 0; }

  .game-top{
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 3px;
  }

  .tag{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .tag-icon{
    width: 11px;
    height: 11px;
    object-fit: contain;
    display: block;
  }
  .tag-cup{ background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
  .tag-league{ background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
  .tag-beach{ background: color-mix(in srgb, var(--navy-2) 14%, transparent); color: var(--navy-2); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tag-beach{ color: #93a8d6; }
  }
  :root[data-theme="dark"] .tag-beach{ color: #93a8d6; }
  .tag-national{ background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }

  /* Active filter tab takes on its own competition's color, matching the
     tag pill color used on each game row, instead of a generic navy/blue.
     Prefixed with #tabs so this beats the existing dark-mode .tab.is-active
     overrides (":root:not([data-theme=\"light\"]) .tab.is-active" etc.),
     which outrank a plain three-class selector on specificity alone. */
  #tabs .tab.tag-cup.is-active{ background: var(--blue); color: #fff; }
  #tabs .tab.tag-league.is-active{ background: var(--green); color: #fff; }
  #tabs .tab.tag-beach.is-active{ background: var(--navy-2); color: #fff; }
  #tabs .tab.tag-national.is-active{ background: var(--red); color: #fff; }

  .game-time{
    font-size: 11px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .game-opp{
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin: 2px 0 1px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .opp-logo{
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: #ffffff;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .opp-logo img{ width: 18px; height: 18px; object-fit: contain; display: block; }
  .opp-logo-blank{ display: none; }

  .game-loc{
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0;
  }

  .game-note{
    font-size: 11.5px;
    font-style: italic;
    color: var(--ink-soft);
    margin: 3px 0 0;
  }

  .score-box{
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 58px;
    padding: 6px 4px;
    border-radius: 10px;
    text-align: center;
  }
  .score-result{
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 15px;
    line-height: 1;
  }
  .score-line{
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
    color: var(--ink-soft);
  }
  .result-w{ background: color-mix(in srgb, var(--green) 14%, transparent); }
  .result-w .score-result{ color: var(--green); }
  .result-l{ background: color-mix(in srgb, var(--red) 14%, transparent); }
  .result-l .score-result{ color: var(--red); }
  .result-t{ background: color-mix(in srgb, var(--ink-soft) 14%, transparent); }
  .result-t .score-result{ color: var(--ink-soft); }
  .result-upcoming{ background: color-mix(in srgb, var(--ink-soft) 8%, transparent); }
  .result-upcoming .score-result{ color: var(--ink-soft); }
  .result-upcoming .score-line{ color: var(--ink-soft); }


  /* ---------- Postponed stamp ---------- */
  .ppd-stamp{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-7deg);
    padding: 2px 10px 1px;
    border: 2px solid var(--red);
    border-radius: 5px;
    color: var(--red);
    background: color-mix(in srgb, var(--card) 35%, transparent);
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1.1;
    white-space: nowrap;
    opacity: 0.85;
    pointer-events: none;
    z-index: 2;
  }
  .game{ position: relative; }
  .game.is-postponed .date-box,
  .game.is-postponed .game-main{ opacity: 0.5; }
  .result-ppd{ background: color-mix(in srgb, var(--red) 12%, transparent); }
  .result-ppd .score-result{ color: var(--red); }
  .result-ppd .score-line{ color: var(--red); font-size: 9.5px; letter-spacing: 0.02em; }

  footer.note{
    text-align:center;
    font-size: 11.5px;
    color: var(--ink-soft);
    padding: 4px 16px 2px;
  }
  .game{ flex-wrap: wrap; }

  .detail-toggle{
    flex-basis: 100%;
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 6px 0 0 58px;
    background: none;
    border: none;
    padding: 0;
    font-family: "Inter", sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--blue);
    cursor: pointer;
  }
  .detail-toggle .chevron{
    width: 9px;
    height: 9px;
    transition: transform .15s ease;
  }
  .detail-toggle[aria-expanded="true"] .chevron{ transform: rotate(180deg); }

  .game-detail{
    flex-basis: calc(100% - 58px);
    min-width: 0;
    margin: 10px 0 0 58px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .game-detail[hidden]{ display: none; }

  .match-bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .match-side{
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .match-side-right{ justify-content: flex-end; }
  .match-name{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .match-side .opp-logo{ flex: none; }
  .match-center{
    flex: none;
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: "Barlow Condensed", sans-serif;
  }
  .jersey-icon{ display: block; flex: none; }
  .jersey-icon-opp path{
    stroke: rgba(0,0,0,0.35);
    stroke-width: 1;
    stroke-linejoin: round;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .jersey-icon-opp path{ stroke: rgba(255,255,255,0.4); }
  }
  :root[data-theme="dark"] .jersey-icon-opp path{ stroke: rgba(255,255,255,0.4); }
  .match-num{
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .match-ft{
    font-size: 10px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .event-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .event-row{ text-align: center; }
  .event-line{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .event-icon{
    width: 13px;
    height: 13px;
    flex: none;
    display: block;
  }
  .event-icon-goal{ color: var(--green); }
  .event-icon-yellow{ color: #c9a227; }
  .event-icon-red{ color: var(--red); }
  .event-name{ white-space: nowrap; }
  .event-sep{ color: var(--ink-soft); }
  .event-minute{
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .event-subdetail{
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .event-clip{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    margin-left: 2px;
    border-radius: 50%;
    color: var(--blue);
    background: color-mix(in srgb, var(--blue) 14%, transparent);
    text-decoration: none;
  }
  .event-clip svg{ width: 13px; height: 13px; display: block; }
  .event-clip:hover{ background: color-mix(in srgb, var(--blue) 26%, transparent); }
  .event-row-opp .event-line{ color: var(--ink-soft); }
  .event-row-opp .event-icon-goal{ color: var(--ink-soft); }
  .veo-link{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    padding: 9px 14px;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--navy) 0%, var(--green-dark) 100%);
    text-decoration: none;
    font-family: "Inter", sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: #fff;
  }
  .veo-link:hover{ filter: brightness(1.08); }
  .veo-link img{
    height: 13px;
    width: auto;
    display: block;
  }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="header">
      <div class="header-main">
        <div class="badge"><img id="svu-badge" src="" alt="Shenandoah Valley United logo" data-i18n-alt="Shenandoah Valley United logo"></div>
        <div class="header-text">
          <p class="eyebrow">Shenandoah Valley United</p>
          <h1 class="club-name" data-i18n>Fixtures</h1>
          <a class="back-link" href="index.html">&larr; <span data-i18n>Home</span></a>
        </div>
      </div>
      <div class="table-links" id="table-links"><div class="table-icons" id="table-icons"></div><span class="table-label" data-i18n>Table</span></div>
    </div>
    <div class="tabs" role="tablist" aria-label="Filter by competition" data-i18n-aria="Filter by competition" id="tabs"></div>
    <ul class="games" id="games-list"></ul>
    <p class="empty-state" id="empty-state" data-i18n>No games in this competition yet.</p>
  </div>
  <footer class="note" id="version-note">Shenandoah Valley United Soccer Club</footer>
</div>

<script src="i18n.js?v=1"></script>
<script src="shared.js?v=6"></script>
<script>
const VERSION = "4.3";

const EVENT_ICON = {
  goal: '<svg class="event-icon event-icon-goal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.2 15.6 9.8l-1.4 4.3H9.8L8.4 9.8Z" fill="currentColor" stroke="none"/><path d="M12 7.2V4M15.6 9.8l2.8-.9M14.2 14.1l1.7 2.5M9.8 14.1l-1.7 2.5M8.4 9.8l-2.8-.9"/></svg>',
  yellow: '<svg class="event-icon event-icon-yellow" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="3" width="12" height="18" rx="2"/></svg>',
  red: '<svg class="event-icon event-icon-red" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="3" width="12" height="18" rx="2"/></svg>',
};

function buildEventsByGame(events) {
  const map = {};
  events
    .filter(e => e.type === "goal")  // yellow/red cards are recorded in events.csv but not shown here, per parent feedback
    .forEach(e => {
      if (!map[e.game]) map[e.game] = [];
      map[e.game].push(e);
    });
  Object.values(map).forEach(list => list.sort((a, b) => parseInt(a.minute, 10) - parseInt(b.minute, 10)));
  return map;
}

function eventRowHtml(e) {
  const isOpp = e.team === "OPP";
  const icon = EVENT_ICON[e.type] || "";
  const name = isOpp ? `${escapeHtml(e.player)} ${t("(opp)")}` : escapeHtml(e.player);
  const detailHtml = e.detail ? `<div class="event-subdetail">${escapeHtml(eventDetail(e.detail))}</div>` : "";
  const clipHtml = e.clip_url
    ? `<a class="event-clip" href="${escapeHtml(e.clip_url)}" target="_blank" rel="noopener" aria-label="${t("Watch clip")}" title="${t("Watch clip")}"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="6" width="13" height="12" rx="2.5"/><path d="M16.5 10.2 21.2 7.3a.5.5 0 0 1 .8.4v8.6a.5.5 0 0 1-.8.4l-4.7-2.9z"/></svg></a>`
    : "";
  return `<li class="event-row${isOpp ? " event-row-opp" : ""}">
        <div class="event-line">${icon}<span class="event-name">${name}</span><span class="event-sep">&middot;</span><span class="event-minute">${escapeHtml(e.minute)}&prime;</span>${clipHtml}</div>
        ${detailHtml}
      </li>`;
}

function matchBarHtml(g) {
  const logoKey = OPP_LOGO[g.opponent];
  const oppLogoHtml = (logoKey && LOGOS[logoKey])
    ? `<span class="opp-logo"><img src="data:image/png;base64,${LOGOS[logoKey]}" alt=""></span>`
    : `<span class="opp-logo opp-logo-blank"></span>`;
  const svuLogoHtml = `<span class="opp-logo"><img src="data:image/png;base64,${LOGOS.svu_badge}" alt=""></span>`;

  // Jersey colors: the opponent wears whichever of their two colors isn't
  // the one SVU claimed for this game (home team gets first pick), so a
  // single per-game "kit" value drives both sides' icons.
  const jc = jerseyColors(g);
  const oppJerseyHtml = jc ? jerseyIconHtml(jc.opp, null, true) : "";
  const svuJerseyHtml = jc ? jerseyIconHtml(jc.svu, jc.svuOutline, false) : "";

  // ESPN convention: away team on the left, home team on the right.
  const opp = { logo: oppLogoHtml, jersey: oppJerseyHtml, name: escapeHtml(oppName(g.opponent)), score: escapeHtml(g.opp_score) };
  const svu = { logo: svuLogoHtml, jersey: svuJerseyHtml, name: "SVU", score: escapeHtml(g.svu_score) };
  const [left, right] = svuOnLeft(g) ? [svu, opp] : [opp, svu];
  return `<div class="match-bar">
        <div class="match-side">${left.logo}<span class="match-name">${left.name}</span></div>
        <div class="match-center">${left.jersey}<span class="match-num">${left.score}</span><span class="match-ft">${t("FT")}</span><span class="match-num">${right.score}</span>${right.jersey}</div>
        <div class="match-side match-side-right"><span class="match-name">${right.name}</span>${right.logo}</div>
      </div>`;
}

function veoLinkHtml(g) {
  if (!g.veo_url) return "";
  return `<a class="veo-link" href="${escapeHtml(g.veo_url)}" target="_blank" rel="noopener">
        <img src="data:image/png;base64,${LOGOS.veo_logo_white}" alt="VEO">
        <span>${t("Watch full match")}</span>
      </a>`;
}

function renderGames(games, eventsByGame) {
  const list = document.getElementById("games-list");
  list.innerHTML = games.map(g => {
    const [mon, day] = monthDay(g.date);
    const compClass = COMP_CLASS[g.competition] || "tag-league";
    const iconKey = COMP_ICON[g.competition];
    const tagIcon = iconKey && LOGOS[iconKey] ? `<img class="tag-icon" src="data:image/png;base64,${LOGOS[iconKey]}" alt="">` : "";

    const result = (g.result || "").trim().toUpperCase();
    const ppd = isPostponed(g);
    let scoreHtml;
    if (ppd) {
      scoreHtml = `<div class="score-box result-ppd"><span class="score-result">${t("PPD")}</span><span class="score-line">${t("Postponed")}</span></div>`;
    } else if (result) {
      scoreHtml = `<div class="score-box result-${result.toLowerCase()}"><span class="score-result">${escapeHtml(resultLetter(result))}</span><span class="score-line">${escapeHtml(g.svu_score)}\u2013${escapeHtml(g.opp_score)}</span></div>`;
    } else {
      scoreHtml = `<div class="score-box result-upcoming"><span class="score-result">\u2014</span><span class="score-line">${t("Upcoming")}</span></div>`;
    }

    const note = gameNote(g);
    const noteHtml = note ? `<p class="game-note">${escapeHtml(note)}</p>` : "";

    const logoKey = OPP_LOGO[g.opponent];
    const oppLogoHtml = (logoKey && LOGOS[logoKey])
      ? `<span class="opp-logo"><img src="data:image/png;base64,${LOGOS[logoKey]}" alt=""></span>`
      : `<span class="opp-logo opp-logo-blank"></span>`;

    const gameEvents = (eventsByGame && eventsByGame[g.game]) || [];
    let detailHtml = "";
    if (gameEvents.length || g.veo_url) {
      const eventsHtml = gameEvents.length ? `<ul class="event-list">${gameEvents.map(eventRowHtml).join("")}</ul>` : "";
      detailHtml = `
        <button type="button" class="detail-toggle" aria-expanded="false" data-target="detail-${escapeHtml(g.game)}">
          <span>${t("Highlights")}</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="game-detail" id="detail-${escapeHtml(g.game)}" hidden>
          ${matchBarHtml(g)}
          ${eventsHtml}
          ${veoLinkHtml(g)}
        </div>`;
    }

    return `
      <li class="game${ppd ? ' is-postponed' : ''}" data-comp="${escapeHtml(g.competition)}">${ppd ? `<span class="ppd-stamp">${t("Postponed")}</span>` : ''}
        <div class="date-box">
          <span class="date-mon">${mon}</span>
          <span class="date-day">${day}</span>
        </div>
        <div class="game-main">
          <div class="game-top">
            <span class="tag ${compClass}">${tagIcon}${escapeHtml(g.competition)}</span>
            <span class="game-time">${escapeHtml(g.time)}</span>
          </div>
          <p class="game-opp">${oppLogoHtml}${isAway(g) ? "@" : "vs"} ${escapeHtml(oppName(g.opponent))}</p>
          <p class="game-loc">${escapeHtml(g.location)}</p>
          ${noteHtml}
        </div>
        ${scoreHtml}
        ${detailHtml}
      </li>`;
  }).join("");

  list.querySelectorAll(".detail-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const panel = document.getElementById(btn.dataset.target);
      const expanded = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!expanded));
      panel.hidden = expanded;
    });
  });
}

function renderTableLinks() {
  const container = document.getElementById("table-icons");
  container.innerHTML = Object.entries(COMP_TABLE).map(([comp, entry]) => {
    const icon = entry.icon && LOGOS[entry.icon] ? `<img src="data:image/png;base64,${LOGOS[entry.icon]}" alt="${escapeHtml(comp)}">` : "";
    return `<a class="table-link" data-comp="${escapeHtml(comp)}" href="${escapeHtml(entry.url)}" target="_blank" rel="noopener">${icon}</a>`;
  }).join("");
}

function updateTableLink(filter) {
  // A filter with its own mapped table (e.g. Columbus Day Tournament) shows
  // only that one icon; "all" or a competition with no table (Blue Ridge
  // Cup) shows every table icon, since none of them is a better match than
  // the others.
  const onlyThisComp = filter !== "all" && COMP_TABLE[filter] ? filter : null;
  document.querySelectorAll("#table-links .table-link").forEach(link => {
    link.hidden = onlyThisComp ? link.dataset.comp !== onlyThisComp : false;
  });
}

function renderTabs(games) {
  const seen = [];
  games.forEach(g => { if (g.competition && !seen.includes(g.competition)) seen.push(g.competition); });
  const tabs = [["all", t("All")], ...seen.map(c => [c, c === "VCSL Regular Season" ? "VCSL" : c])];
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = tabs.map(([val, label], i) => {
    const iconKey = COMP_ICON[val];
    const icon = iconKey && LOGOS[iconKey] ? `<img class="tab-icon" src="data:image/png;base64,${LOGOS[iconKey]}" alt="">` : "";
    const compClass = COMP_CLASS[val] || "";
    const cls = ["tab", compClass, i === 0 ? "is-active" : ""].filter(Boolean).join(" ");
    return `<button type="button" class="${cls}" data-filter="${escapeHtml(val)}">${icon}${escapeHtml(label)}</button>`;
  }).join("");

  const gameEls = () => document.querySelectorAll(".game");
  const emptyState = document.getElementById("empty-state");

  function applyFilter(filter) {
    let visibleCount = 0;
    gameEls().forEach(game => {
      const match = filter === "all" || game.getAttribute("data-comp") === filter;
      game.hidden = !match;
      if (match) visibleCount++;
    });
    emptyState.classList.toggle("is-visible", visibleCount === 0);
    updateTableLink(filter);
  }

  tabsEl.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      tabsEl.querySelectorAll(".tab").forEach(t => t.classList.remove("is-active"));
      tab.classList.add("is-active");
      applyFilter(tab.getAttribute("data-filter"));
    });
  });

  updateTableLink("all");
}


document.getElementById("svu-badge").src = "data:image/png;base64," + LOGOS.svu_badge;
renderTableLinks();
document.getElementById("version-note").textContent = "Shenandoah Valley United Soccer Club · v" + VERSION;

Promise.all([
  fetch("schedule.csv", { cache: "no-cache" }).then(r => r.ok ? r.text() : Promise.reject()),
  fetch("events.csv", { cache: "no-cache" }).then(r => r.ok ? r.text() : "").catch(() => ""),
  fetch("teams.csv", { cache: "no-cache" }).then(r => r.ok ? r.text() : "").catch(() => ""),
  fetch("kits.csv", { cache: "no-cache" }).then(r => r.ok ? r.text() : "").catch(() => ""),
])
  .then(([scheduleText, eventsText, teamsText, kitsText]) => {
    const games = sortGames(parseCSV(scheduleText));
    const eventsByGame = buildEventsByGame(eventsText ? parseCSV(eventsText) : []);
    loadTeamData(teamsText, kitsText);
    renderTabs(games);
    renderGames(games, eventsByGame);
  })
  .catch(() => {
    document.getElementById("games-list").innerHTML = "";
    document.getElementById("empty-state").classList.add("is-visible");
    document.getElementById("empty-state").textContent = t("Schedule data couldn't be loaded.");
  });
</script>
</body>
</html>
