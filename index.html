<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVU U16</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --navy:#122548;
    --navy-2:#1b3564;
    --blue:#3a67b0;
    --green:#0a8a51;
    --green-dark:#03532f;
    --red:#b3402f;
    --paper:#f5f7f9;
    --card:#ffffff;
    --ink:#13181f;
    --ink-soft:#5b6472;
    --line:#e3e7ec;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#0c1930;
      --navy-2:#132648;
      --blue:#5a86d6;
      --green:#17a468;
      --green-dark:#0a6b41;
      --red:#d9695a;
      --paper:#0b0f16;
      --card:#131a24;
      --ink:#eef1f5;
      --ink-soft:#9aa5b3;
      --line:#232c39;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0c1930;
    --navy-2:#132648;
    --blue:#5a86d6;
    --green:#17a468;
    --green-dark:#0a6b41;
    --red:#d9695a;
    --paper:#0b0f16;
    --card:#131a24;
    --ink:#eef1f5;
    --ink-soft:#9aa5b3;
    --line:#232c39;
  }

  * { box-sizing: border-box; }

  body{
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    margin: 0;
  }

  .page{
    width: 100%;
    max-width: 480px;
    padding-inline: 16px;
    padding-block: 20px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(10,20,40,0.06), 0 10px 30px rgba(10,20,40,0.08);
  }

  .header{
    background: linear-gradient(155deg, var(--navy) 0%, var(--navy-2) 62%, var(--green-dark) 130%);
    padding: 22px 20px 20px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    position: relative;
  }
  .header-main{
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .header::after{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(120px 90px at 88% -10%, rgba(255,255,255,0.10), transparent 70%);
    pointer-events:none;
  }

  .badge{
    width: 50px;
    height: 50px;
    border-radius: 13px;
    background: rgba(255,255,255,0.96);
    display:flex;
    align-items:center;
    justify-content:center;
    flex: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .badge img{ width: 40px; height: 40px; object-fit: contain; display:block; }

  .table-links{
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    position: relative;
    z-index: 1;
    padding-top: 1px;
  }
  .table-icons{
    display: grid;
    grid-template-columns: repeat(2, 24px);
    justify-content: center;
    gap: 4px;
  }
  /* When all 3 links show, push the last one (Presidents Cup, added last
     in COMP_TABLE) into the right column instead of the left, so it lines
     up under the 2nd icon above it instead of sitting under the 1st. Only
     applies when a 3rd link actually exists and isn't hidden by a tab
     filter, so a single remaining icon still sits flush in column 1. */
  .table-icons:has(.table-link:nth-child(3):not([hidden]))
    .table-link:last-child{ grid-column: 2; }
  .table-link{ display: block; }
  .table-link[hidden]{ display: none; }
  .table-link:hover img{ filter: brightness(1.08); }
  .table-link img{
    width: 24px;
    height: 24px;
    object-fit: contain;
    border-radius: 6px;
    background: rgba(255,255,255,0.96);
    padding: 3px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    display: block;
  }
  .table-label{
    color: rgba(255,255,255,0.85);
    font-family: "Barlow Condensed", "Inter", sans-serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .header-text{ min-width:0; }

  .eyebrow{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    margin: 0 0 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .club-name{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
    margin: 0 0 4px;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.78);
    text-decoration: none;
  }
  .back-link:hover{ color: #fff; }

  .tabs{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 12px 4px;
  }

  .tab{
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: "Inter", sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: color-mix(in srgb, var(--ink-soft) 10%, transparent);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 6px 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab-icon{
    width: 14px;
    height: 14px;
    object-fit: contain;
    border-radius: 3px;
    display: block;
  }
  .tab:focus-visible{
    outline: 2px solid var(--blue);
    outline-offset: 1px;
  }
  .tab.is-active{
    background: var(--navy);
    color: #ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tab.is-active{ background: var(--blue); }
  }
  :root[data-theme="dark"] .tab.is-active{ background: var(--blue); }

  .empty-state{
    display: none;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 24px 16px 20px;
  }
  .empty-state.is-visible{ display: block; }

  ul.games{
    list-style: none;
    margin: 0;
    padding: 6px 8px 10px;
  }

  .game{
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 8px;
    border-bottom: 1px solid var(--line);
  }
  .game[hidden]{ display: none; }
  .game:last-child{ border-bottom: none; }

  .date-box{
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--navy) 8%, transparent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.05;
  }
  .date-mon{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .date-day{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .game-main{ flex: 1; min-width: 0; }

  .game-top{
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 3px;
  }

  .tag{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .tag-icon{
    width: 11px;
    height: 11px;
    object-fit: contain;
    display: block;
  }
  .tag-cup{ background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
  .tag-league{ background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
  .tag-beach{ background: color-mix(in srgb, var(--navy-2) 14%, transparent); color: var(--navy-2); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tag-beach{ color: #93a8d6; }
  }
  :root[data-theme="dark"] .tag-beach{ color: #93a8d6; }
  .tag-national{ background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }

  /* Active filter tab takes on its own competition's color, matching the
     tag pill color used on each game row, instead of a generic navy/blue.
     Prefixed with #tabs so this beats the existing dark-mode .tab.is-active
     overrides (":root:not([data-theme=\"light\"]) .tab.is-active" etc.),
     which outrank a plain three-class selector on specificity alone. */
  #tabs .tab.tag-cup.is-active{ background: var(--blue); color: #fff; }
  #tabs .tab.tag-league.is-active{ background: var(--green); color: #fff; }
  #tabs .tab.tag-beach.is-active{ background: var(--navy-2); color: #fff; }
  #tabs .tab.tag-national.is-active{ background: var(--red); color: #fff; }

  .game-time{
    font-size: 11px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .game-opp{
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin: 2px 0 1px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .opp-logo{
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: #ffffff;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .opp-logo img{ width: 18px; height: 18px; object-fit: contain; display: block; }
  .opp-logo-blank{ display: none; }

  .game-loc{
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0;
  }

  .game-note{
    font-size: 11.5px;
    font-style: italic;
    color: var(--ink-soft);
    margin: 3px 0 0;
  }

  .score-box{
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 58px;
    padding: 6px 4px;
    border-radius: 10px;
    text-align: center;
  }
  .score-result{
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 15px;
    line-height: 1;
  }
  .score-line{
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
    color: var(--ink-soft);
  }
  .result-w{ background: color-mix(in srgb, var(--green) 14%, transparent); }
  .result-w .score-result{ color: var(--green); }
  .result-l{ background: color-mix(in srgb, var(--red) 14%, transparent); }
  .result-l .score-result{ color: var(--red); }
  .result-t{ background: color-mix(in srgb, var(--ink-soft) 14%, transparent); }
  .result-t .score-result{ color: var(--ink-soft); }
  .result-upcoming{ background: color-mix(in srgb, var(--ink-soft) 8%, transparent); }
  .result-upcoming .score-result{ color: var(--ink-soft); }
  .result-upcoming .score-line{ color: var(--ink-soft); }

  footer.note{
    text-align:center;
    font-size: 11.5px;
    color: var(--ink-soft);
    padding: 4px 16px 2px;
  }
  .game{ flex-wrap: wrap; }

  .detail-toggle{
    flex-basis: 100%;
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 6px 0 0 58px;
    background: none;
    border: none;
    padding: 0;
    font-family: "Inter", sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--blue);
    cursor: pointer;
  }
  .detail-toggle .chevron{
    width: 9px;
    height: 9px;
    transition: transform .15s ease;
  }
  .detail-toggle[aria-expanded="true"] .chevron{ transform: rotate(180deg); }

  .game-detail{
    flex-basis: calc(100% - 58px);
    min-width: 0;
    margin: 10px 0 0 58px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .game-detail[hidden]{ display: none; }

  .match-bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .match-side{
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .match-side-right{ justify-content: flex-end; }
  .match-name{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .match-side .opp-logo{ flex: none; }
  .match-center{
    flex: none;
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: "Barlow Condensed", sans-serif;
  }
  .jersey-icon{ display: block; flex: none; }
  .jersey-icon-opp path{
    stroke: rgba(0,0,0,0.35);
    stroke-width: 1;
    stroke-linejoin: round;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .jersey-icon-opp path{ stroke: rgba(255,255,255,0.4); }
  }
  :root[data-theme="dark"] .jersey-icon-opp path{ stroke: rgba(255,255,255,0.4); }
  .match-num{
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .match-ft{
    font-size: 10px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .event-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .event-row{ text-align: center; }
  .event-line{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .event-icon{
    width: 13px;
    height: 13px;
    flex: none;
    display: block;
  }
  .event-icon-goal{ color: var(--green); }
  .event-icon-yellow{ color: #c9a227; }
  .event-icon-red{ color: var(--red); }
  .event-name{ white-space: nowrap; }
  .event-sep{ color: var(--ink-soft); }
  .event-minute{
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .event-subdetail{
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .event-clip{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    margin-left: 2px;
    border-radius: 50%;
    color: var(--blue);
    background: color-mix(in srgb, var(--blue) 14%, transparent);
    text-decoration: none;
  }
  .event-clip svg{ width: 13px; height: 13px; display: block; }
  .event-clip:hover{ background: color-mix(in srgb, var(--blue) 26%, transparent); }
  .event-row-opp .event-line{ color: var(--ink-soft); }
  .event-row-opp .event-icon-goal{ color: var(--ink-soft); }
  .veo-link{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    padding: 9px 14px;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--navy) 0%, var(--green-dark) 100%);
    text-decoration: none;
    font-family: "Inter", sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: #fff;
  }
  .veo-link:hover{ filter: brightness(1.08); }
  .veo-link img{
    height: 13px;
    width: auto;
    display: block;
  }
  /* ---------- Next match card (above the filter tabs) ---------- */
  .next-match{
    margin: 12px 12px 2px;
    padding: 12px 14px 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: color-mix(in srgb, var(--navy) 5%, var(--card));
  }
  .next-match[hidden]{ display: none; }
  .next-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .next-label{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .next-match .match-bar{ margin-bottom: 8px; align-items: flex-start; }
  /* Crest on top, name underneath, so long opponent names can wrap to two
     lines instead of being cut off next to the kickoff time. */
  .next-match .match-side{
    flex-direction: column;
    justify-content: flex-start;
    gap: 4px;
    text-align: center;
  }
  .next-match .match-side .opp-logo{ width: 30px; height: 30px; border-radius: 8px; }
  .next-match .match-side .opp-logo img{ width: 25px; height: 25px; }
  .next-match .match-name{
    white-space: normal;
    overflow: visible;
    font-size: 14px;
    line-height: 1.1;
  }
  .next-match .match-center{ padding-top: 4px; }
  /* TBD opponent: keep the empty crest's space so both names line up. */
  .next-match .opp-logo-blank{ display: flex; visibility: hidden; }
  .next-when{
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.05;
    min-width: 62px;
  }
  .next-time{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .next-date{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .next-loc{
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    margin: 0;
  }
  .next-weather{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    min-height: 28px;
  }
  .next-weather[hidden]{ display: none; }
  .wx-icon{ width: 28px; height: 28px; flex: none; display: block; color: var(--blue); }
  .wx-temp{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .wx-text{ min-width: 0; line-height: 1.25; }
  .wx-cond{ font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .wx-meta{ font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .wx-note{ font-size: 11.5px; color: var(--ink-soft); font-style: italic; }

  /* ---------- Homepage ---------- */
  .home-links{
    display: flex;
    gap: 12px;
    margin-top: 2px;
  }
  .section{ padding: 14px 12px 4px; }
  .section + .section{ border-top: 1px solid var(--line); margin-top: 10px; }
  .section-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 0 4px 10px;
  }
  .section-title{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
    margin: 0;
  }
  .section-sub{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  /* Records row */
  .records-row{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 14px 12px 4px;
  }
  .record-tile{
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px 9px;
    background: color-mix(in srgb, var(--navy) 5%, var(--card));
    text-align: center;
  }
  .record-tile-label{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .record-tile-value{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.05;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .record-tile-key{
    font-size: 10.5px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }

  /* Weekend fixture cards reuse the .next-match card look */
  .fixtures{ display: flex; flex-direction: column; gap: 10px; }
  .fixtures .next-match{ margin: 0; }
  .status{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .status-live{ color: var(--red); }
  .status-w{ color: var(--green); }
  .status-l{ color: var(--red); }
  .final-score{
    font-family: "Barlow Condensed", sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .empty-note a{ color: var(--blue); font-weight: 600; }
  .empty-note{
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 14px 8px 10px;
    margin: 0;
  }

  /* Competitions list */
  ul.comp-list{ list-style: none; margin: 0; padding: 0 0 4px; }
  .comp-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 6px;
    border-bottom: 1px solid var(--line);
    color: inherit;
    text-decoration: none;
  }
  .comp-list li:last-child .comp-row{ border-bottom: none; }
  .comp-icon{
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: #ffffff;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .comp-icon img{ width: 24px; height: 24px; object-fit: contain; display: block; }
  .comp-main{ flex: 1; min-width: 0; }
  .comp-name{ font-size: 14px; font-weight: 600; color: var(--ink); }
  .comp-rec{ font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .comp-action{
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--blue);
    white-space: nowrap;
  }
  .comp-action svg{ width: 12px; height: 12px; }
  .comp-action-none{ color: var(--ink-soft); font-weight: 500; }
  a.comp-row:hover .comp-name{ color: var(--blue); }

  /* Roster / Fixtures buttons */
  .nav-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 14px 12px 14px;
    border-top: 1px solid var(--line);
    margin-top: 10px;
  }
  .nav-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 10px;
    border-radius: 14px;
    background: linear-gradient(120deg, var(--navy) 0%, var(--navy-2) 70%, var(--green-dark) 140%);
    color: #ffffff;
    text-decoration: none;
    font-family: "Barlow Condensed", sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .nav-btn svg{ width: 17px; height: 17px; flex: none; }
  .nav-btn:hover{ filter: brightness(1.1); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .nav-btn{ background: linear-gradient(120deg, var(--navy-2) 0%, var(--blue) 140%); }
  }
  :root[data-theme="dark"] .nav-btn{ background: linear-gradient(120deg, var(--navy-2) 0%, var(--blue) 140%); }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="header">
      <div class="header-main">
        <div class="badge"><img id="svu-badge" src="" alt="Shenandoah Valley United logo"></div>
        <div class="header-text">
          <p class="eyebrow">Shenandoah Valley United</p>
          <h1 class="club-name">U16 Boys</h1>
          <div class="home-links">
            <a class="back-link" href="roster.html">Roster &rarr;</a>
            <a class="back-link" href="schedule.html">Fixtures &rarr;</a>
          </div>
        </div>
      </div>
    </div>

    <div class="records-row" id="records"></div>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title" id="weekend-title">This Weekend</h2>
        <span class="section-sub" id="weekend-range"></span>
      </div>
      <div class="fixtures" id="weekend-list"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Competitions</h2>
        <span class="section-sub">Tables</span>
      </div>
      <ul class="comp-list" id="comp-list"></ul>
    </section>

    <nav class="nav-grid" aria-label="Team pages">
      <a class="nav-btn" href="roster.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.2A5.5 5.5 0 0 1 21.5 20"/></svg>Roster</a>
      <a class="nav-btn" href="schedule.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Fixtures</a>
    </nav>
  </div>
  <footer class="note" id="version-note">Shenandoah Valley United Soccer Club</footer>
</div>

<script src="shared.js?v=1"></script>
<script>
const VERSION = "3.0";
const DAY_MS = 24 * 60 * 60 * 1000;

// ---------- Records row ----------
function renderRecords(games) {
  const overall = wltOf(games);
  const league = wltOf(games.filter(g => g.competition === "VCSL Regular Season"));
  document.getElementById("records").innerHTML = [
    ["Overall", overall],
    ["Reg. Season", league],
  ].map(([label, r]) => `<div class="record-tile">
      <div class="record-tile-label">${label}</div>
      <div class="record-tile-value">${r.text}</div>
      <div class="record-tile-key">W-L-T</div>
    </div>`).join("");
}

// ---------- This weekend ----------
// Anchor on the next game that hasn't finished, then show every game in
// that same Mon-Sun week, so a tournament weekend lists all of its games
// (including Saturday's result once Sunday's games are what's next).
function weekendGames(games) {
  const next = findNextGame(games);
  if (!next) return null;
  const a = next.dt.day;
  const start = new Date(a.getFullYear(), a.getMonth(), a.getDate() - ((a.getDay() + 6) % 7)); // Monday
  const end = new Date(start.getTime() + 7 * DAY_MS);
  const list = games
    .map(g => ({ g, dt: gameDateTime(g) }))
    .filter(x => x.dt && x.dt.day >= start && x.dt.day < end)
    .sort((x, y) => (x.dt.kickoff || x.dt.day) - (y.dt.kickoff || y.dt.day));
  return { anchor: a, list };
}

function shortDate(d) {
  return `${MONTHS[d.getMonth() + 1]} ${d.getDate()}`;
}

function rangeLabel(list) {
  const first = list[0].dt.day, last = list[list.length - 1].dt.day;
  if (first.getTime() === last.getTime()) return `${DAY_NAMES[first.getDay()]} ${shortDate(first)}`;
  if (first.getMonth() === last.getMonth()) return `${shortDate(first)} \u2013 ${last.getDate()}`;
  return `${shortDate(first)} \u2013 ${shortDate(last)}`;
}

function fixtureCardHtml(g, dt, idx) {
  const result = (g.result || "").trim().toUpperCase();
  const now = Date.now();
  const live = !result && dt.kickoff && now >= dt.kickoff.getTime() && now < dt.kickoff.getTime() + GAME_LENGTH_MS;

  const jc = jerseyColors(g);
  const opp = { logo: oppLogoHtml(g.opponent), jersey: jc ? jerseyIconHtml(jc.opp, null, true) : "", name: escapeHtml(g.opponent), score: escapeHtml(g.opp_score) };
  const svu = { logo: svuLogoHtml(), jersey: jc ? jerseyIconHtml(jc.svu, jc.svuOutline, false) : "", name: "SVU", score: escapeHtml(g.svu_score) };
  const [left, right] = svuOnLeft(g) ? [svu, opp] : [opp, svu]; // away left, home right

  const dateLabel = `${DAY_NAMES[dt.day.getDay()]} ${shortDate(dt.day)}`;
  let status, center;
  if (result) {
    const word = { W: "Win", L: "Loss", T: "Draw" }[result] || result;
    status = `<span class="status status-${result.toLowerCase()}">Final \u00b7 ${word}</span>`;
    center = `<span class="final-score">${left.score} \u2013 ${right.score}</span><span class="next-date">${dateLabel}</span>`;
  } else {
    status = live ? `<span class="status status-live">Live</span>` : `<span class="status">Upcoming</span>`;
    const time = dt.kickoff ? escapeHtml(g.time.toUpperCase()) : "Time TBD";
    center = `<span class="next-time">${time}</span><span class="next-date">${dateLabel}</span>`;
  }

  return `<div class="next-match">
    <div class="next-head">${status}${compTagHtml(g.competition)}</div>
    <div class="match-bar">
      <div class="match-side">${left.logo}<span class="match-name">${left.name}</span></div>
      <div class="match-center">${left.jersey}<div class="next-when">${center}</div>${right.jersey}</div>
      <div class="match-side">${right.logo}<span class="match-name">${right.name}</span></div>
    </div>
    <p class="next-loc">${escapeHtml(g.location)}</p>
    ${result ? "" : `<div class="next-weather" id="wx-${idx}" hidden></div>`}
  </div>`;
}

function renderWeekend(games) {
  const listEl = document.getElementById("weekend-list");
  const titleEl = document.getElementById("weekend-title");
  const rangeEl = document.getElementById("weekend-range");
  const wk = weekendGames(games);
  if (!wk || !wk.list.length) {
    titleEl.textContent = "Upcoming";
    listEl.innerHTML = `<p class="empty-note">No upcoming games scheduled. See <a href="schedule.html">Fixtures</a> for results.</p>`;
    return;
  }

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const daysOut = Math.round((wk.anchor - today) / DAY_MS);
  const allWeekend = wk.list.every(x => x.dt.day.getDay() === 0 || x.dt.day.getDay() === 6);
  titleEl.textContent = daysOut <= 6 ? (allWeekend ? "This Weekend" : "This Week") : "Next Up";
  rangeEl.textContent = rangeLabel(wk.list);

  listEl.innerHTML = wk.list.map((x, i) => fixtureCardHtml(x.g, x.dt, i)).join("");

  // Fill in each upcoming game's forecast as it arrives.
  wk.list.forEach((x, i) => {
    if ((x.g.result || "").trim()) return;
    weatherHtml(x.g, x.dt).then(html => {
      const box = document.getElementById(`wx-${i}`);
      if (box && html) { box.innerHTML = html; box.hidden = false; }
    });
  });
}

// ---------- Competitions ----------
const EXTERNAL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';

function renderCompetitions(games) {
  document.getElementById("comp-list").innerHTML = competitionsOf(games).map(comp => {
    const key = COMP_ICON[comp];
    const icon = key && LOGOS[key] ? `<img src="data:image/png;base64,${LOGOS[key]}" alt="">` : "";
    const rec = wltOf(games.filter(g => g.competition === comp));
    const recText = rec.played ? `${rec.text} (W-L-T)` : "No games played yet";
    const table = COMP_TABLE[comp];
    const inner = `<span class="comp-icon">${icon}</span>
        <span class="comp-main"><span class="comp-name">${escapeHtml(comp)}</span><br><span class="comp-rec">${recText}</span></span>
        ${table ? `<span class="comp-action">Table ${EXTERNAL_ICON}</span>` : `<span class="comp-action comp-action-none">No table</span>`}`;
    return table
      ? `<li><a class="comp-row" href="${escapeHtml(table.url)}" target="_blank" rel="noopener">${inner}</a></li>`
      : `<li><div class="comp-row">${inner}</div></li>`;
  }).join("");
}

// ---------- Boot ----------
document.getElementById("svu-badge").src = "data:image/png;base64," + LOGOS.svu_badge;
document.getElementById("version-note").textContent = "Shenandoah Valley United Soccer Club · v" + VERSION;

Promise.all([
  fetchText("schedule.csv", true),
  fetchText("teams.csv"),
  fetchText("kits.csv"),
]).then(([scheduleText, teamsText, kitsText]) => {
  const games = parseCSV(scheduleText);
  loadTeamData(teamsText, kitsText);
  renderRecords(games);
  try { renderWeekend(games); } catch (e) { document.getElementById("weekend-list").innerHTML = ""; }
  renderCompetitions(games);
}).catch(() => {
  document.getElementById("weekend-list").innerHTML = `<p class="empty-note">Schedule data couldn't be loaded.</p>`;
});
</script>
</body>
</html>
