<style>

    :root:not([data-theme="light"]){
      --navy:#0c1930;
      --navy-2:#132648;
      --blue:#5a86d6;
      --green:#17a468;
      --green-dark:#0a6b41;
      --paper:#0b0f16;
      --card:#131a24;
      --ink:#eef1f5;
      --ink-soft:#9aa5b3;
      --line:#232c39;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0c1930;
    --navy-2:#132648;
    --blue:#5a86d6;
    --green:#17a468;
    --green-dark:#0a6b41;
    --paper:#0b0f16;
    --card:#131a24;
    --ink:#eef1f5;
    --ink-soft:#9aa5b3;
    --line:#232c39;
  }

  * { box-sizing: border-box; }

  body{
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    justify-content: center;
    margin: 0;
  }

  .page{
    width: 100%;
    max-width: 480px;
    padding-inline: 16px;
    padding-block: 20px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(10,20,40,0.06), 0 10px 30px rgba(10,20,40,0.08);
  }

  /* ---------- Hero ---------- */
  .hero{
    position: relative;
    background: linear-gradient(155deg, var(--navy) 0%, var(--navy-2) 58%, var(--green-dark) 125%);
    padding: 16px 18px 20px;

  /* Big faint jersey number behind everything, trading-card style */
  .hero-num-bg{

    right: -6px;
    bottom: -34px;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 190px;
    line-height: 1;
    color: rgba(255,255,255,0.07);
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .hero-top{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.78);
    text-decoration: none;
  }
  .back-link:hover{ color: #fff; }
  .club-mark{

    align-items: center;
    gap: 7px;

  @media (prefers-color-scheme: dark){

  /* "This Season" title row with clean-sheet shields on the right */
  .section-head{ display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; margin: 0 0 10px; }

  .cs-badges{ display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px; color: var(--green); }
  .cs-badge svg{ width: 20px; height: 20px; display: block; }

  /* Per-game goal/assist log */

  .log-row{

  .opp-logo{

    font-weight: 700;
    border-radius: 6px;
    padding: 2px 7px;

    background: var(--green);

  .muted{ font-size: 13px; color: var(--ink-soft); margin: 0; }

    text-align: center;
    font-size: 11.5px;

<body>
<div class="page">
  <div class="card" id="profile-card">
    <p class="empty-state">Loading…</p>
  </div>
  <footer class="note" id="version-note">Shenandoah Valley United Soccer Club</footer>
</div>

<script src="shared.js?v=4"></script>
<script>
const VERSION = "1.7";

const POSITION_NAMES = { GK: "Goalkeeper", DF: "Defender", MF: "Midfielder", FW: "Forward" };

// Which stat tiles to show, picked by the player's first listed position.
// "—" shows when a number hasn't been recorded yet (e.g. saves).
const STAT_SETS = {
  default: [
    { key: "played", label: "Games" },
    { key: "goals", label: "Goals" },
    { key: "assists", label: "Assists" },
  ],
  // Keepers: tall Games tile on the left, 2x2 grid of keeper numbers on the right.
  GK: [
    { key: "played", label: "Games", cls: "stat-tall" },
    { key: "goalsAgainst", label: "Goals Against", cls: "stat-navy" },
    { key: "gaa", label: "Goals Against Avg", cls: "stat-green" },
    { key: "shotsAgainst", label: "Shots on Target Against", cls: "stat-green" },
    { key: "saves", label: "Saves", cls: "stat-navy" },
  ],
};

// Games left out of goals-against average and season clean sheets
// (keepers and defenders).
// Game 1 (Skyline Elite U15) was rained out and called at 0-0.
const GK_EXCLUDE_GAMES = new Set(["1"]);

// keepers.csv rows with game = "season" hold season totals that aren't split
// by game yet (e.g. "5 saves this season"). They add to the season tiles only.
// When per-game numbers come in, delete the season row so nothing counts twice.
const SEASON_ROW = "season";

// Regulation length for U16 games (two 40-minute halves). A keeper whose
// keepers.csv row covers 0 to FULL_GAME_MIN played the full game.
const FULL_GAME_MIN = 80;
const HALF_MIN = FULL_GAME_MIN / 2;

// Filled shield with a check, used for the season clean-sheet badges.
const CS_BADGE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l7.5 3.2v5.4c0 4.8-3.2 8.9-7.5 10.7-4.3-1.8-7.5-5.9-7.5-10.7V5.7L12 2.5z" fill="currentColor"/><path d="M8.6 12.2l2.4 2.4 4.4-4.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const SHIELD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>';

// "5-11" -> 5′ 11″
function heightHtml(h) {
  const m = /^(\d)\s*[-' ]\s*(\d{1,2})/.exec(h || "");
  return m ? `${m[1]}′ ${m[2]}″` : escapeHtml(h);
}

function notFound(msg) {
  document.getElementById("profile-card").innerHTML =
    `<p class="empty-state">${msg}<br><br><a href="roster.html">&larr; Back to roster</a></p>`;
}

function spellLabel(from, to) {
  if (from <= 0 && to >= FULL_GAME_MIN) return "Full game";
  if (from <= 0 && to === HALF_MIN) return "1st half";
  if (from === HALF_MIN && to >= FULL_GAME_MIN) return "2nd half";
  return `${from}′–${to}′`;
}

// One keeper spell (a keepers.csv row) with goals against worked out from the
// minutes of opponent goals in events.csv.
function keeperSpell(k, oppGoals) {
  const from = Number(k.from_min) || 0;
  const to = k.to_min === "" ? FULL_GAME_MIN : Number(k.to_min);
  const ga = oppGoals.filter(e => {
    const m = Number(e.minute);
    return m > from && m <= to;
  }).length;
  const saves = (k.saves ?? "") === "" ? null : Number(k.saves);
  const full = from <= 0 && to >= FULL_GAME_MIN;
  return { from, to, mins: to - from, ga, saves, full, clean: full && ga === 0 };
}

function render(player, profile, games, events, absences, keepers) {
  const name = player.name;
  const parts = name.split(" ");
  const first = parts.shift();
  const last = parts.join(" ") || "";
  const positions = (player.position || "").split("/").map(p => p.trim().toUpperCase()).filter(Boolean);
  document.title = `${name} · SVU`;

  // Every completed game goes in the log, newest at the bottom.
  const played = sortGames(games.filter(g => (g.result || "").trim()));
  const missed = new Set(absences.filter(a => a.player === name).map(a => a.game));

  const mine = events.filter(e => e.team === "SVU" && e.player === name);
  const totals = { played: 0, goals: 0, assists: 0, saves: null, shotsAgainst: null, goalsAgainst: 0, gaa: null };
  let gaaGoals = 0, gaaMins = 0;
  const cleanSheets = [];
  const isGK = positions[0] === "GK";
  const isDF = positions.includes("DF");

  const logRows = played.map(g => {
    const [mon, day] = monthDay(g.date);
    const vs = isAway(g) ? "@" : "vs";
    const score = ` · ${g.result} ${g.svu_score}-${g.opp_score}`;
    const head = `
      <div class="log-date"><span class="m">${mon}</span><span class="d">${day}</span></div>
      ${oppLogoHtml(g.opponent)}`;
    const opp = `<p class="log-opp">${vs} ${escapeHtml(g.opponent)}<span class="muted">${escapeHtml(score)}</span></p>`;

    if (missed.has(g.game)) {
      return `<li class="log-row is-dnp">${head}
        <div class="log-main">${opp}<p class="log-detail">Did not play</p></div>
        <div class="log-chips"><span class="chip chip-dnp">DNP</span></div></li>`;
    }
    totals.played++;
    // Team shutout: SVU conceded nothing (Skyline rainout excluded). Defenders
    // and keepers get a shield for every shutout they were on the field for,
    // even part of the game (keepers usually split halves).
    const teamShutout = String(g.opp_score).trim() === "0" && !GK_EXCLUDE_GAMES.has(g.game);
    if (isDF && teamShutout) cleanSheets.push(g);

    const goals = mine.filter(e => e.game === g.game && e.type === "goal")
      .sort((a, b) => Number(a.minute) - Number(b.minute));
    const assists = mine.filter(e => e.game === g.game && e.type === "assist");
    totals.goals += goals.length;
    totals.assists += assists.length;

    const bits = goals.map(e => {
      const label = `Goal ${e.minute ? e.minute + "′" : ""}${e.detail ? " (" + escapeHtml(e.detail) + ")" : ""}`.trim();
      return e.clip_url ? `<a href="${escapeHtml(e.clip_url)}" target="_blank" rel="noopener">${label} ▸</a>` : label;
    });
    if (assists.length) bits.push(assists.length === 1 ? "Assist" : `${assists.length} assists`);

    // Time in goal this game (can be more than one row if he went in twice).
    const oppGoals = events.filter(e => e.game === g.game && e.team === "OPP" && e.type === "goal");
    const spells = keepers.filter(k => k.game === g.game && k.player === name).map(k => keeperSpell(k, oppGoals));
    let gaChip = "";
    if (spells.length) {
      const ga = spells.reduce((n, sp) => n + sp.ga, 0);
      const saveVals = spells.map(sp => sp.saves).filter(v => v !== null);
      const saves = saveVals.length ? saveVals.reduce((a, b) => a + b, 0) : null;
      totals.goalsAgainst += ga;
      if (saves !== null) totals.saves = (totals.saves || 0) + saves;
      if (!GK_EXCLUDE_GAMES.has(g.game)) {
        gaaGoals += ga;
        gaaMins += spells.reduce((n, sp) => n + sp.mins, 0);
      }
      const clean = teamShutout;
      if (clean && isGK) cleanSheets.push(g);
      const gk = [`${spells.map(sp => spellLabel(sp.from, sp.to)).join(", ")} in goal`];
      if (saves !== null) gk.push(`${saves} ${saves === 1 ? "save" : "saves"}`);
      if (clean) gk.push(`<span class="clean-sheet">${SHIELD_ICON}Clean sheet</span>`);
      bits.push(gk.join(" · "));
      gaChip = `<span class="chip chip-gk">${ga} GA</span>`;
    }

    const chips = [
      goals.length ? `<span class="chip">${goals.length} G</span>` : "",
      assists.length ? `<span class="chip chip-a">${assists.length} A</span>` : "",
      gaChip,
    ].filter(Boolean);
    if (!chips.length) chips.push(`<span class="chip chip-played">Played</span>`);

    return `<li class="log-row">${head}
      <div class="log-main">${opp}${bits.length ? `<p class="log-detail">${bits.join(" · ")}</p>` : ""}</div>
      <div class="log-chips">${chips.join("")}</div></li>`;
  }).join("");

  // Season-only totals (not split by game yet).
  keepers.filter(k => k.game === SEASON_ROW && k.player === name && (k.saves ?? "") !== "")
    .forEach(k => { totals.saves = (totals.saves || 0) + Number(k.saves); });

  // Every shot on target is either saved or goes in, so
  // shots on target against = saves + goals against (only once saves are known).
  if (totals.saves !== null) totals.shotsAgainst = totals.saves + totals.goalsAgainst;

  // GAA = goals against x 80 / minutes in goal (40 per half).
  if (gaaMins > 0) totals.gaa = (gaaGoals * FULL_GAME_MIN / gaaMins).toFixed(2);

  const statSet = STAT_SETS[positions[0]] || STAT_SETS.default;
  const statTiles = statSet.map(s =>
    `<div class="stat ${s.cls || ""}"><p class="stat-value">${totals[s.key] ?? "—"}</p><p class="stat-label">${s.label}</p></div>`).join("");

  // One shield per team shutout he played in, next to the "This Season" title.
  const cleanBadges = (isGK || isDF) && cleanSheets.length ? `
    <span class="cs-badges" aria-label="${cleanSheets.length} clean ${cleanSheets.length === 1 ? "sheet" : "sheets"}">
      ${cleanSheets.map(g => `<span class="cs-badge" title="Clean sheet vs ${escapeHtml(g.opponent)}">${CS_BADGE}</span>`).join("")}
      <span class="cs-label">${cleanSheets.length === 1 ? "Clean sheet" : cleanSheets.length + " clean sheets"}</span>
    </span>` : "";

  const facts = [];
  if (profile.grad_year) facts.push(`<div class="fact"><p class="fact-label">Class</p><p class="fact-value">${escapeHtml(profile.grad_year)}</p></div>`);
  if (profile.height) facts.push(`<div class="fact"><p class="fact-label">Height</p><p class="fact-value">${heightHtml(profile.height)}</p></div>`);
  if (profile.weight) facts.push(`<div class="fact"><p class="fact-label">Weight</p><p class="fact-value">${escapeHtml(profile.weight)} <span class="fact-unit">lbs</span></p></div>`);

  const school = profile.high_school ? `
    <div class="school">
      ${profile.school_logo ? `<div class="school-logo"><img src="${escapeHtml(profile.school_logo)}" alt=""></div>` : ""}
      <div><p class="school-label">High School</p><p class="school-name">${escapeHtml(profile.high_school)}</p></div>
    </div>` : "";

  document.getElementById("profile-card").innerHTML = `
    <div class="hero">
      <div class="hero-num-bg" aria-hidden="true">${escapeHtml(player.number)}</div>
      <div class="hero-top">
        <a class="back-link" href="roster.html">&larr; Roster</a>
        <span class="club-mark"><img src="data:image/png;base64,${LOGOS.svu_badge}" alt="">Shenandoah Valley United</span>
      </div>
      <div class="hero-body">
        ${profile.photo ? `<img class="photo" src="${escapeHtml(profile.photo)}" alt="${escapeHtml(name)}">` : ""}
        <div class="hero-text">
          <p class="hero-num">#${escapeHtml(player.number)}</p>
          <p class="first-name">${escapeHtml(first)}</p>
          <h1 class="last-name">${escapeHtml(last)}</h1>
          <div class="pos-pills">${positions.map(p => `<span class="pos-pill">${POSITION_NAMES[p] || escapeHtml(p)}</span>`).join("")}</div>
        </div>
      </div>
    </div>
    ${school || facts.length ? `<div class="section">${school}${facts.length ? `<div class="facts">${facts.join("")}</div>` : ""}</div>` : ""}
    <div class="section">
      <div class="section-head"><p class="section-title">This Season</p>${cleanBadges}</div>
      <div class="stats${isGK ? " stats-gk" : ""}">${statTiles}</div>
    </div>
    <div class="section">
      <p class="section-title">Game Log</p>
      ${logRows ? `<ul class="log">${logRows}</ul>` : `<p class="muted">No games played yet.</p>`}
    </div>`;
}

document.getElementById("version-note").textContent = "Shenandoah Valley United Soccer Club · v" + VERSION;

(async () => {
  const n = new URLSearchParams(location.search).get("n");
  try {
    const [rosterText, profilesText, scheduleText, eventsText, absencesText, keepersText] = await Promise.all([
      fetchText("roster.csv", true),
      fetchText("profiles.csv", true),
      fetchText("schedule.csv", false),
      fetchText("events.csv", false),
      fetchText("absences.csv", false),
      fetchText("keepers.csv", false),
    ]);
    const player = parseCSV(rosterText).find(p => p.number === n);
    const profile = parseCSV(profilesText).find(p => p.number === n);
    if (!player || !profile) return notFound("No profile for this player yet.");
    const csv = t => t ? parseCSV(t) : [];
    render(player, profile, csv(scheduleText), csv(eventsText), csv(absencesText), csv(keepersText));
  } catch (e) {
    notFound("Player data couldn't be loaded.");
  }
})();
</script>
</body>
